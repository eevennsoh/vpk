<!DOCTYPE html>
<!-- Capture fixture for the vpk-html media pipeline (references/media-pipeline.md). Not a library document:
     the runtime pipeline skips assets/lab/. Offline, grayscale, deterministic: window.__vpkRehearsal.hold(t)
     draws the frame for clock time t, so capture.mjs can step it one frame at a time. Three card throws start at
     0, 2 and 4 s: lift 0-0.6 s (vpkOut), throw 0.6-1.6 s on an arc (vpkOut, inOut, outBold), land 1.6-1.95 s
     on a spring (k 220, c 20). The Throw button plays the same 6 s live, for the screencast test. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rehearsal target · three throws</title>
<style>
	:root { color-scheme: light; --paper: #f4f2ef; --ink: #2b2928; --rule: #c9c4c0; --muted: #6f6a67; }
	html, body { background: var(--paper); color: var(--ink); height: 100%; margin: 0; }
	body { font: 15px/1.4 ui-monospace, Menlo, monospace; overflow: hidden; }
	canvas { display: block; height: 720px; width: 1280px; }
	button { background: var(--paper); border: 1px solid var(--ink); border-radius: 18px; color: var(--ink); font: inherit; height: 36px; left: 1130px; padding: 0 16px; position: absolute; top: 24px; }
</style>
</head>
<body>
<canvas id="stage" width="1280" height="720" aria-label="Three cards thrown from a pile on the left to a slot on the right"></canvas>
<button type="button" id="throw">Throw</button>
<script>
(() => {
	"use strict";
	// ---- Maths (ported from scripts/lab/runtime/core.mjs: cubicBezier, spring) ----
	function cubicBezier(x1, y1, x2, y2) {
		const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
		const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
		const sx = s => ((ax * s + bx) * s + cx) * s;
		const sy = s => ((ay * s + by) * s + cy) * s;
		return x => {
			if (x <= 0 || x >= 1) return Math.min(1, Math.max(0, x));
			let lo = 0, hi = 1, s = x;
			for (let i = 0; i < 40; i += 1) {
				if (sx(s) < x) lo = s; else hi = s;
				s = (lo + hi) / 2;
			}
			return sy(s);
		};
	}
	function spring(t, k = 220, c = 20) {
		if (!(t > 0)) return 0;
		const w = Math.sqrt(k), z = c / (2 * w);
		if (z >= 1) return 1 - Math.exp(-w * t) * (1 + w * t);
		const wd = w * Math.sqrt(1 - z * z), d = Math.exp(-z * w * t);
		return 1 - d * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t));
	}
	const EASES = [cubicBezier(0.16, 1, 0.3, 1), cubicBezier(0.4, 0, 0, 1), cubicBezier(0, 0.4, 0, 1)];
	const NAMES = ["vpkOut", "inOut", "outBold"];
	const LIFT = cubicBezier(0.16, 1, 0.3, 1);
	const W = 150, H = 90, X0 = 120, X1 = 1010, LANES = [200, 360, 520], DURATION = 6;
	const progress = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)));

	/** Card k's rectangle at clock time t: { x, y, w, h } (x, y = top left, in CSS px). */
	function cardBox(t, k) {
		const tau = t - 2 * k;
		const lane = LANES[k] - H / 2;
		if (tau < 0) return { x: X0, y: lane, w: W, h: H };
		if (tau < 0.6) return { x: X0, y: lane - 40 * LIFT(progress(tau, 0, 0.6)), w: W, h: H };
		if (tau < 1.6) {
			const u = EASES[k](progress(tau, 0.6, 1.6));
			return { x: X0 + (X1 - X0) * u, y: lane - 40 - 120 * Math.sin(Math.PI * u), w: W, h: H };
		}
		return { x: X1, y: lane - 40 * (1 - spring(tau - 1.6)), w: W, h: H };
	}

	// ---- Drawing ----
	const canvas = document.getElementById("stage");
	const ctx = canvas.getContext("2d");
	const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
	function rounded(x, y, w, h, r) {
		ctx.beginPath();
		ctx.moveTo(x + r, y);
		ctx.arcTo(x + w, y, x + w, y + h, r);
		ctx.arcTo(x + w, y + h, x, y + h, r);
		ctx.arcTo(x, y + h, x, y, r);
		ctx.arcTo(x, y, x + w, y, r);
		ctx.closePath();
	}
	let clock = 0;
	function render(t) {
		clock = Math.min(DURATION, Math.max(0, t));
		ctx.fillStyle = css("--paper");
		ctx.fillRect(0, 0, 1280, 720);
		ctx.fillStyle = css("--ink");
		ctx.font = "600 22px ui-monospace, Menlo, monospace";
		ctx.fillText("Three throws", 120, 60);
		ctx.font = "15px ui-monospace, Menlo, monospace";
		ctx.fillStyle = css("--muted");
		LANES.forEach((lane, k) => {
			ctx.fillText(`${k + 1} · ${NAMES[k]}`, 120, lane + H / 2 + 34);
			ctx.strokeStyle = css("--rule");
			ctx.lineWidth = 1.5;
			ctx.setLineDash([6, 6]);
			rounded(X1, lane - H / 2, W, H, 10);
			ctx.stroke();
			ctx.setLineDash([]);
		});
		for (let k = 0; k < 3; k += 1) {
			const box = cardBox(clock, k);
			ctx.fillStyle = css("--ink");
			rounded(box.x, box.y, box.w, box.h, 10);
			ctx.fill();
		}
		ctx.fillStyle = css("--ink");
		ctx.font = "600 28px ui-monospace, Menlo, monospace";
		ctx.fillText(`t ${clock.toFixed(2)} s`, 1080, 680);
	}

	// ---- Rehearsal hook (lab-kit.md C8) and live play ----
	let live = 0;
	let liveStart = 0;
	function stopLive() {
		if (live) cancelAnimationFrame(live);
		live = 0;
	}
	function playLive() {
		stopLive();
		liveStart = performance.now();
		const tick = now => {
			const t = (now - liveStart) / 1000;
			render(t);
			live = t < DURATION ? requestAnimationFrame(tick) : 0;
		};
		live = requestAnimationFrame(tick);
	}
	window.__vpkRehearsal = Object.freeze({
		duration: DURATION,
		hold(t) { stopLive(); render(Number(t)); },
		release() { stopLive(); },
		time: () => clock,
	});
	window.__vpkFixture = Object.freeze({ cardBox, lanes: LANES, card: { w: W, h: H }, x0: X0, x1: X1, duration: DURATION });
	document.getElementById("throw").addEventListener("click", playLive);
	render(0);
})();
</script>
</body>
</html>
