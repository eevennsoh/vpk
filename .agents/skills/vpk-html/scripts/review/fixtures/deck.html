<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Launch review deck</title>
	<style>
		@font-face { font-family: "VPK Fixture"; src: url(data:font/woff2;base64,AAAA) format("woff2"); }
		:root { color-scheme: light dark; }
		[data-theme="dark"] { color-scheme: dark; }
		body { font-family: "VPK Fixture", system-ui, sans-serif; margin: 0; }
		.slide { min-height: 100vh; padding: 48px; }
	</style>
</head>
<body>
<main>
	<section class="slide" id="s1">
		<h1>Launch review</h1>
		<p>Three decisions before the board ships to everyone.</p>
		<aside class="speaker-notes"><p>Open with the film.</p></aside>
	</section>
	<section class="slide" id="s2">
		<h2>Rollout order</h2>
		<p>Internal teams first, then ten percent, then everyone over three days.</p>
	</section>
	<section class="slide" id="s3">
		<h2>Retry policy</h2>
		<p>A failed send retries three times, five minutes apart.</p>
	</section>
</main>
</body>
</html>
