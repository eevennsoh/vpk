version = 1
id = "automation-merge"
kind = "cron"
name = "Automation merge"
prompt = "# Goal\nMerge open VPK automation pull requests that the low-risk policy allows and that pass the `$vpk-git-ship` review gate. This job is a merger, not a producer: it does not invoke the scheduled-automation policy, edits no code, and opens no PRs.\n\n# Candidates\nUse repo `eevennsoh/vpk`. List `gh pr list --repo eevennsoh/vpk --state open --label automation --label automerge:allowed --json number,headRefOid,title,url`. Handle them one at a time in ascending PR number. For each PR, stop at the first failed step below, record the reason and move to the next PR.\n\n# Per-PR steps\n1. Eligibility: run `node scripts/automation-merge-eligibility.mjs --pr <n> --repo eevennsoh/vpk --json`. Continue only on exit 0, and take `headRefOid` from its output as the candidate head. Exit 2 or 1: skip and record the reasons.\n2. Codex review: require a Codex signal on that exact head, either a `chatgpt-codex-connector[bot]` review whose `commit_id` equals the head (`gh api repos/eevennsoh/vpk/pulls/<n>/reviews --paginate`) or a `+1` reaction from `chatgpt-codex-connector[bot]` on the PR (`gh api repos/eevennsoh/vpk/issues/<n>/reactions --paginate`) created after the head commit's `committedDate`. A review with findings, an `eyes` reaction, a stale-head signal or no signal: skip until the next run. Do not post `@codex review`.\n3. Gate: run `node .agents/skills/vpk-git-ship/scripts/review-gate-status.js --pr <n> --repo eevennsoh/vpk --require-clear --json` with no `--wait`, so a pending check ends this PR's turn instead of holding the run. Continue only on exit 0 with the gate's `headRefOid` equal to the candidate head.\n   - Pending checks: skip until the next run.\n   - Failing checks: add the `automerge:blocked` label and comment on the PR naming each failing check and its URL. Do not rerun or fix it.\n   - Interrupted or billing-blocked checks, unresolved threads, non-approving reviews or a changed head: skip and record why. Do not rerun runs, and never run local CI to stand in for billing-blocked checks in this job.\n4. Merge: run `node .agents/skills/vpk-git-ship/scripts/merge-remote.js --pr <n> --repo eevennsoh/vpk --head <candidate head>`. Record the merge commit and `branchDeletion.state`. Never use `--admin`, `gh pr merge` (with or without `--auto`) or GitHub native auto-merge, and never approve a PR.\n5. Sync: find a worktree with `main` checked out (`git worktree list --porcelain`). Run `git -C <that worktree> pull --ff-only origin main` only if `git -C <that worktree> branch --show-current` prints `main` and `git -C <that worktree> status --porcelain` is empty; otherwise skip the sync and say why. Never switch a checkout's branch, stash, reset or discard changes.\n\n# Report\nOne line per candidate: merged (merge commit), skipped (reason) or blocked (failing checks). Record every decision with PR number, head SHA and reason in Automation Merge memory."
status = "ACTIVE"
rrule = "RRULE:FREQ=WEEKLY;BYHOUR=9,11,13,15,17,19;BYMINUTE=10;BYDAY=MO,TU,WE,TH,FR"
model = "gpt-6.2-sol"
reasoning_effort = "high"
execution_environment = "local"
