version = 1
id = "main-health"
kind = "cron"
name = "Main health"
prompt = "Invoke `$vpk-scheduled-automation` and apply its shared producer policy together with this task.\n\n## Task\nRun `node .agents/skills/vpk-git-ship/scripts/main-health.js` and act only when its `main health:` line is `RED`. Diagnose the failing jobs of that `main` CI run and produce one small fix for exactly one failure whose cause is evidenced in the job log. Return no PR when the line is `green`, `unknown` or `billing-blocked`.\n\n## Evidence and judgment\nRead the failed job logs with `gh run view <id> --log-failed`. Name the commit that turned `main` red by comparing with the last green run. Prefer the smallest change that restores the broken contract; fix the code under test rather than weakening the assertion, unless the assertion itself is demonstrably wrong. A cancelled or timed-out job is not a failure to fix: report it and stop.\n\n## Handoff\nUse title `[Automation] Main health: <failing job>: <short summary>` and existing labels `automation`, `codex` and `bugfix`. Include the red run URL, the breaking commit, the root cause with log lines, the fix, the focused tests run and reviewer focus.\n\n## Stop conditions\nReturn no PR when another open PR already fixes the same failure, the cause is outside the repo (GitHub outage, billing, a third-party service), or the fix needs a product decision."
status = "ACTIVE"
rrule = "RRULE:FREQ=WEEKLY;BYHOUR=8;BYMINUTE=45;BYDAY=MO,TU,WE,TH,FR"
model = "gpt-6.2-sol"
reasoning_effort = "high"
execution_environment = "worktree"
