version = 1
id = "artifact-cleanup"
kind = "cron"
name = "Artifact cleanup"
prompt = "# Goal\nClean only proven disposable local artifacts inside `/Users/esoh/Labs/vpk`.\n\n# Success criteria\nA removed path must be inside the repo; untracked; ignored or an eligible empty directory; in an allowed disposable category; idle; unreferenced; and not protected state. Recheck the affected categories afterward and confirm no tracked file was deleted or staged.\n\n# Evidence\nEstablish the repo root and inspect ignored/untracked status. For every candidate, use path-scoped Git tracking/ignore evidence, contents and age, source references, and process ownership as needed. Delete only after every eligibility condition is proved.\n\nAllowed categories include reproducible browser/test/build output under `output/**`, disposable caches and temp subpaths, generated language artifacts, logs/debug output outside `artifacts/**`, OS/editor temp files, `*.tsbuildinfo`, stale `.dev-*` metadata, generated `.rovodev/*.generated.*`, and generated `.gsd/` output.\n\n# Protected boundaries\n- Never delete, prune, rotate, empty, or modify `artifacts/**`, even when ignored, old, or idle.\n- Preserve tracked files, dependencies, secrets, config, fixtures, snapshots, docs/product assets, source/test data, and active runtime state.\n- Treat `.tmp/` as protected by default; remove only an exact subpath proven disposable. Preserve personal graph, Symphony, and other known state.\n- Remove a non-ignored directory only when it is empty at deletion time, untracked, unreferenced, idle, and not a source/state placeholder.\n- Do not create branches, commits, pushes, PRs, or staged changes.\n\n# Output\nReport removed ignored paths, removed empty directories, category counts, skipped paths with reasons, process blockers, and final scoped status. If nothing is eligible, say why briefly. Do not narrate commands.\n\n# Stop rules\nSkip any candidate that is outside the repo, tracked, ambiguous, process-owned without safe path-scoped proof, protected, or requires Git/PR work."
status = "ACTIVE"
rrule = "RRULE:FREQ=DAILY;BYHOUR=23;BYMINUTE=20"
model = "gpt-6-luna"
reasoning_effort = "medium"
execution_environment = "local"
