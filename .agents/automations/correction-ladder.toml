version = 1
id = "correction-ladder"
kind = "cron"
name = "Correction ladder"
prompt = "Invoke `$vpk-scheduled-automation` and apply its shared producer policy together with this task.\n\n## Task\nMine the user's own coding-agent prompts from the last 7 days of VPK work for recurring corrections, then push the most valuable unenforced one down the ladder in `.agents/docs/playbooks/push-corrections-down-the-ladder.md`.\n\n## Evidence\n- Sources, user-authored text only: `~/.claude/history.jsonl` and `~/.claude/projects/*vpk*/*.jsonl`; `~/.codex/history.jsonl` plus `~/.codex/sessions/**` whose session cwd is a VPK checkout (skip automation, subagent and guardian sessions); Cursor `~/Library/Application Support/Cursor/User/globalStorage/state.vscdb` composer bubbles for VPK workspaces (copy the database to a temp dir before reading and delete the copy after).\n- A correction is the user undoing, redirecting or repeating an instruction (\"again\", \"I said\", \"don't\", \"still broken\", \"why did you\").\n- Cluster by theme and count distinct sessions per tool. Never copy secrets, tokens or third-party personal details into any output.\n\n## Judgment\n- Check existing guards first: `eslint.config.mjs` + `eslint-suppressions.json`, `scripts/verify-source-guardrails.js`, `.agents/rules/*.md`, skills and `DESIGN.md`.\n- For the top recurring theme that nothing enforces yet, choose the lowest rung that can hold it: codebase paved path, then lint/CI (baseline existing violations with `--suppress-rule`), then a `paths:`-scoped rule (regenerate `.agents/rules/cursor/` mirrors), then a skill, then `DESIGN.md`.\n- Patch at most one small, mechanical prevention, with an executable test (`scripts/eslint-boundary-rules.test.js` for lint contracts). Taste or policy themes become recommendations, not enforcement.\n- When the user keeps overriding an existing rule, recommend rewriting that rule instead of adding enforcement.\n\n## Output\nIn memory.md record the window, sessions scanned per tool, top themes with counts and trend versus the previous run, the rung chosen and why, and what shipped or was recommended. Keep at most three short quotes per theme."
status = "ACTIVE"
rrule = "RRULE:FREQ=WEEKLY;BYHOUR=10;BYMINUTE=30;BYDAY=TH"
model = "gpt-6.2-sol"
reasoning_effort = "high"
execution_environment = "worktree"
