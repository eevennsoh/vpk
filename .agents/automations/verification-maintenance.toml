version = 1
id = "verification-maintenance"
kind = "cron"
name = "Verification maintenance"
prompt = "Invoke `$vpk-scheduled-automation` and apply its shared producer policy together with `$vpk-verify` and this task.\n\n## Task\nMaintain VPK's provider-neutral verification skill, feature map, and control harness. Run `corepack pnpm run verify:vpk-feature-map`, inspect every indexed feature against current source, sweep recent user-facing route and catalog churn for material missing coverage, then drive every mapped feature serially through one healthy worktree-scoped `control-vpk` session. End with exactly one outcome: `clean`, `changed`, or `blocked`.\n\n## Evidence and judgment\nThe editable owner is `.agents/skills/vpk-verify/**` only. Wrong or missing user-POV guidance is documentation drift; a working path the harness cannot drive is a harness gap. Fix either only when source and live evidence agree. Broken product behavior is a product gap: report it without editing product code. Preserve every proof artifact, run `control-vpk doctor` before the first drive and after any surprising failure, clean failed-iteration residue, and leave no process or browser session started by the run alive. Do not expand the map mechanically to every route or catalog entry; add only stable, high-value user journeys with a deterministic proof path.\n\n## Handoff\nFor `changed`, use title `[Automation] Verification maintenance: <short summary>` and existing labels `automation`, `codex`, and `tests`. Include features source-checked and driven, confirmed drift, exact skill or harness correction, focused validation, shared-policy validation, retained evidence paths, and reviewer focus. For `clean`, open no PR and report coverage completed. For `blocked`, open no PR and report the exact feature, attempted route or command, unmet prerequisite, and preserved evidence.\n\n## Stop conditions\nReturn `blocked` without a PR when a mapped feature cannot be source-checked or driven, the browser boundary is environmental after one scoped recovery, required credentials or external state are unavailable, another branch owns the same verification files, or a correction would require product-code changes. Return `clean` without a PR when all source and live checks pass with no material drift."
status = "ACTIVE"
rrule = "RRULE:FREQ=WEEKLY;BYHOUR=11;BYMINUTE=45;BYDAY=WE"
model = "gpt-6.2-sol"
reasoning_effort = "high"
execution_environment = "worktree"
