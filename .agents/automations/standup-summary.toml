version = 1
id = "standup-summary"
kind = "heartbeat"
name = "Standup summary"
prompt = "# Goal\nCreate a read-only standup summary of high-signal VPK activity since the previous successful heartbeat.\n\n# Repository and window\nUse `/Users/esoh/labs/vpk`. Treat any Documents-era checkout path as stale.\n\nUse the previous successful heartbeat time only when current runtime or target-task evidence supports it. Otherwise use the elapsed interval since the previous scheduled heartbeat. Show the final range in plain language with the local timezone.\n\n# Evidence\nUse current GitHub PR, issue, check, and commit evidence first; use local Git history or high-signal files only to clarify impact. Broaden a suspiciously empty merged-PR query before concluding nothing merged. Do not treat local worktrees, branches, Codex tasks, Claude worktrees, or chat history as portfolio state.\n\nEvery material claim needs a concrete PR, issue, check, commit, or file. Format each first PR mention as `#<number> - <title>`; never show a PR number alone when its title is available.\n\n# Notify when\nNotify for meaningful merges; PRs needing review or blocked/failed/stale attention; automation PR state changes; relevant issue changes; or high-signal dependency, CI, workflow, guidance, runtime, or release-safety changes.\n\nStay quiet when there are no meaningful merges, automation changes, actionable PRs/issues, high-signal local changes, or watchlist risks.\n\n# Output style\nUse ASD-STE100-style simplified technical English.\n\nAfter the required headings, state the main result, decision, or blocker first. Give evidence and material caveats after it.\n\nUse short, direct sentences and active voice. Use the same word for the same concept. Replace unclear pronouns with the relevant noun.\n\nDo not add unrequested background, repetition, idioms, metaphors, slang, sarcasm, or vague action text. Keep exact PR titles unchanged.\n\nPut a verified next action in Watchlist when one exists. Do not invent an action.\n\n# Output\nWhen notifying, write one concise message with:\n- `Standup summary`\n- `Date range: <start with timezone> to <end with timezone>`\n- 3-7 themed bullets focused on impact\n- `Watchlist` with 1-3 risks or `Watchlist: No immediate follow-ups.`\n\nSay `No open PRs to review.` when true and `No automation PR activity visible in this window.` when true. Do not dump commands or inventory every file/PR.\n\n# Constraints and stop rules\nRead only. Do not mutate GitHub, Git, the repo, external messages, automations, or Codex tasks. If current PR/commit/check evidence is unavailable, do not invent a summary; briefly report the missing evidence."
status = "ACTIVE"
rrule = "RRULE:FREQ=DAILY;BYHOUR=9,13,17;BYMINUTE=30"
