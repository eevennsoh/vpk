name: CI

on:
  pull_request:
  # Direct pushes (e.g. vpk-git-ship-fast) skip PR checks; run the same gate after they land.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Fetch PR base for ratchet checks
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"

      - name: Fetch pre-push tip for ratchet checks
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: git fetch --no-tags --depth=1 origin "$BEFORE_SHA"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Verify lockfile registries
        run: node scripts/verify-pnpm-lockfile.js

      - name: Authenticate to the internal Atlassian npm registry
        # `@atlassian/logo-third-party` (Platform Labs) is internal-only and not in
        # the public npm-remote mirror, so it resolves from `atlassian-npm`.
        # Public @atlaskit packages resolve from npmjs tarballs in the lockfile; this
        # token is only for the internal package tarball, mirroring local `~/.npmrc`.
        # `scripts/write-npmrc.mjs` upserts both registry path variants (metadata uses
        # `/artifactory/api/npm/`, lockfile tarballs use `/api/npm/`) without duplicates.
        # It also writes the Motion+ registry token: `motion-plus` is an alias of
        # `@motionplus/core` on api.motion.dev/npm, and no token lives in the repo.
        run: node scripts/write-npmrc.mjs
        env:
          ATLASSIAN_NPM_TOKEN: ${{ secrets.ATLASSIAN_NPM_TOKEN }}
          MOTION_TOKEN: ${{ secrets.MOTION_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Repository guards
        env:
          # origin/main is the pushed commit itself; ratchet against the previous tip.
          VPK_SUPPRESSIONS_BASE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: time pnpm run verify:fast

      - name: ESLint
        run: time pnpm run lint

      - name: TypeScript
        run: time pnpm run typecheck

  unit:
    name: Unit shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Fetch PR base for ratchet checks
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"

      - name: Fetch pre-push tip for ratchet checks
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: git fetch --no-tags --depth=1 origin "$BEFORE_SHA"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Verify lockfile registries
        run: node scripts/verify-pnpm-lockfile.js

      - name: Authenticate to the internal Atlassian npm registry
        # `@atlassian/logo-third-party` (Platform Labs) is internal-only and not in
        # the public npm-remote mirror, so it resolves from `atlassian-npm`.
        # Public @atlaskit packages resolve from npmjs tarballs in the lockfile; this
        # token is only for the internal package tarball, mirroring local `~/.npmrc`.
        # `scripts/write-npmrc.mjs` upserts both registry path variants (metadata uses
        # `/artifactory/api/npm/`, lockfile tarballs use `/api/npm/`) without duplicates.
        # It also writes the Motion+ registry token: `motion-plus` is an alias of
        # `@motionplus/core` on api.motion.dev/npm, and no token lives in the repo.
        run: node scripts/write-npmrc.mjs
        env:
          ATLASSIAN_NPM_TOKEN: ${{ secrets.ATLASSIAN_NPM_TOKEN }}
          MOTION_TOKEN: ${{ secrets.MOTION_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        env:
          VPK_SUPPRESSIONS_BASE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: time pnpm run test:unit:js --shard "${{ matrix.shard }}/4"

  smoke:
    name: Browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Verify lockfile registries
        run: node scripts/verify-pnpm-lockfile.js

      - name: Authenticate to the internal Atlassian npm registry
        # Same registry setup as the static and unit jobs; see the comment there.
        run: node scripts/write-npmrc.mjs
        env:
          ATLASSIAN_NPM_TOKEN: ${{ secrets.ATLASSIAN_NPM_TOKEN }}
          MOTION_TOKEN: ${{ secrets.MOTION_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the static export
        run: time pnpm run build:export

      - name: Serve the production build
        # The production image copies out/ to backend/public and runs one Express process.
        run: |
          rm -rf backend/public
          cp -R out backend/public
          mkdir -p output/playwright
          # Production mode refuses to start without an admin token: give it a throwaway one for this run.
          VPK_RUNTIME_ADMIN_TOKEN="$(openssl rand -hex 32)" NODE_ENV=production PORT=8080 nohup node backend/server.js > output/playwright/server.log 2>&1 &
          server_pid=$!
          for attempt in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8080/api/health > /dev/null && exit 0
            if ! kill -0 "$server_pid" 2> /dev/null; then
              echo "The server exited before /api/health answered."
              break
            fi
            sleep 2
          done
          cat output/playwright/server.log
          exit 1

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke specs
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080
        run: time pnpm run test:e2e:smoke

      - name: Keep the report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke
          path: output/playwright
          retention-days: 7

  aggregate:
    name: PR checks
    if: ${{ always() }}
    needs: [static, unit, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require every validation and unit shard to succeed
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
        run: |
          echo "Static validation: $STATIC_RESULT; unit shards: $UNIT_RESULT; browser smoke: $SMOKE_RESULT"
          test "$STATIC_RESULT" = success
          test "$UNIT_RESULT" = success
          test "$SMOKE_RESULT" = success
