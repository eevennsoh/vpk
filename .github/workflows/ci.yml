name: CI

on:
  pull_request:
  # Direct pushes (e.g. vpk-git-ship-fast) skip PR checks; run the same gate after they land.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Fetch PR base for ratchet checks
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"

      - name: Fetch pre-push tip for ratchet checks
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: git fetch --no-tags --depth=1 origin "$BEFORE_SHA"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Verify lockfile registries
        run: node scripts/verify-pnpm-lockfile.js

      - name: Authenticate to the internal Atlassian npm registry
        # `@atlassian/logo-third-party` (Platform Labs) is internal-only and not in
        # the public npm-remote mirror, so it resolves from `atlassian-npm`.
        # Public @atlaskit packages resolve from npmjs tarballs in the lockfile; this
        # token is only for the internal package tarball, mirroring local `~/.npmrc`.
        # `scripts/write-npmrc.mjs` upserts both registry path variants (metadata uses
        # `/artifactory/api/npm/`, lockfile tarballs use `/api/npm/`) without duplicates.
        run: node scripts/write-npmrc.mjs
        env:
          ATLASSIAN_NPM_TOKEN: ${{ secrets.ATLASSIAN_NPM_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Repository guards
        env:
          # origin/main is the pushed commit itself; ratchet against the previous tip.
          VPK_SUPPRESSIONS_BASE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: time pnpm run verify:fast

      - name: ESLint
        run: time pnpm run lint

      - name: Design-system lint
        run: time pnpm run lint:design-system

      - name: TypeScript
        run: time pnpm run typecheck

  unit:
    name: Unit shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Fetch PR base for ratchet checks
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"

      - name: Fetch pre-push tip for ratchet checks
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: git fetch --no-tags --depth=1 origin "$BEFORE_SHA"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Verify lockfile registries
        run: node scripts/verify-pnpm-lockfile.js

      - name: Authenticate to the internal Atlassian npm registry
        # `@atlassian/logo-third-party` (Platform Labs) is internal-only and not in
        # the public npm-remote mirror, so it resolves from `atlassian-npm`.
        # Public @atlaskit packages resolve from npmjs tarballs in the lockfile; this
        # token is only for the internal package tarball, mirroring local `~/.npmrc`.
        # `scripts/write-npmrc.mjs` upserts both registry path variants (metadata uses
        # `/artifactory/api/npm/`, lockfile tarballs use `/api/npm/`) without duplicates.
        run: node scripts/write-npmrc.mjs
        env:
          ATLASSIAN_NPM_TOKEN: ${{ secrets.ATLASSIAN_NPM_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        env:
          VPK_SUPPRESSIONS_BASE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: time pnpm run test:unit:js --shard "${{ matrix.shard }}/4"

  aggregate:
    name: PR checks
    if: ${{ always() }}
    needs: [static, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require every validation and unit shard to succeed
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
        run: |
          echo "Static validation: $STATIC_RESULT; unit shards: $UNIT_RESULT"
          test "$STATIC_RESULT" = success
          test "$UNIT_RESULT" = success
