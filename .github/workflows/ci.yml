name: CI

on:
  pull_request:
  # Direct pushes (e.g. vpk-git-ship-fast) skip PR checks; run the same gate after they land.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: PR checks
    runs-on: ubuntu-latest
    # Hosted pnpm bootstrap can consume six minutes before repository checks run.
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Fetch PR base for ratchet checks
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"

      - name: Fetch pre-push tip for ratchet checks
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: git fetch --no-tags --depth=1 origin "$BEFORE_SHA"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Verify lockfile registries
        run: node scripts/verify-pnpm-lockfile.js

      - name: Authenticate to the internal Atlassian npm registry
        # `@atlassian/logo-third-party` (Platform Labs) is internal-only and not in
        # the public npm-remote mirror, so it resolves from `atlassian-npm`.
        # Public @atlaskit packages resolve from npmjs tarballs in the lockfile; this
        # token is only for the internal package tarball, mirroring local `~/.npmrc`.
        # Cover both registry path variants: metadata uses `/artifactory/api/npm/`,
        # internal lockfile tarball URLs use `/api/npm/`.
        run: |
          {
            echo "registry=https://registry.npmjs.org/"
            echo "@atlaskit:registry=https://registry.npmjs.org/"
            echo "@atlassian:registry=https://packages.atlassian.com/artifactory/api/npm/atlassian-npm/"
            echo "//packages.atlassian.com/artifactory/api/npm/atlassian-npm/:_authToken=${ATLASSIAN_NPM_TOKEN}"
            echo "//packages.atlassian.com/api/npm/atlassian-npm/:_authToken=${ATLASSIAN_NPM_TOKEN}"
          } >> "$HOME/.npmrc"
        env:
          ATLASSIAN_NPM_TOKEN: ${{ secrets.ATLASSIAN_NPM_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run fast PR checks
        env:
          # Push builds have no PR base, and origin/main is the pushed commit itself;
          # compare the suppression ledger with the tip before this push instead.
          VPK_SUPPRESSIONS_BASE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: pnpm run ci:pr
