version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Motion+ installs from Motion's private registry (api.motion.dev/npm) with a
    # user-level token that Dependabot does not have. It is pinned exactly; bump it by hand.
    ignore:
      - dependency-name: motion-plus
      - dependency-name: "@motionplus/core"
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      backend-npm-minor-and-patch:
        update-types:
          - minor
          - patch
