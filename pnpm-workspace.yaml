packages:
  - .
  - backend
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # Glimm's current release supplies the scoped transitions requested for the Visual catalog.
  - "glimm@0.4.1"
  # Explicitly requested Voice Glow visual; first published 2026-09-17.
  # Scope the exception to the inspected release, preserving future age checks.
  - "voice-glow@0.2.0"
  # Explicitly requested design-system lint pilot, published 2026-09-14.
  # Exact version so the seven-day maturity gate applies to future updates.
  - "@shadcn/lint@0.1.0"
  - undici
  # Latest gooey effect engine requested before the seven-day maturity gate.
  - liquid-gooey@0.2.1
  # New shadcn headless primitives required for current shadcn/base components.
  - "@shadcn/react"
  # Dev-only tooling; took latest ahead of the 7-day gate by explicit request.
  - react-grab
  - "@react-grab/*"
  - agent-browser
  # ADS source-of-truth tokens; allow same-day design-system updates by request.
  - "@atlaskit/tokens"
  # Transitive runtime gate for current @atlaskit/tokens.
  - "@atlaskit/react-compiler-gating"
  # Trusted internal Platform Labs package (atlassian-npm, not public npm), so
  # the public-supply-chain release-age gate does not apply.
  - "@atlassian/logo-third-party"
  # First-party ADS transitives required by @atlassian/logo-third-party@3.1.0.
  # Version-pinned so the gate re-applies automatically on any future bump; both
  # clear the 7-day window on their own (css 2026-09-02, feature-flags
  # 2026-09-05), so these two lines can simply be deleted after that.
  - "@atlaskit/css@1.1.0"
  - "@atlaskit/platform-feature-flags@2.2.0"
  # Well-established security-header middleware; 8.3.0 taken ahead of the 7-day
  # gate by explicit request (minor CSP update). Version-pinned so the gate
  # re-applies automatically on any future helmet bump.
  - helmet@8.3.0
  # Security fix for the Express/MCP dependency tree. Version-pinned so the
  # seven-day gate re-applies automatically on any future qs bump.
  - qs@6.16.0
  # Authorized fixes for Happy DOM code execution, compressed-body DoS, and
  # URI parsing. Exact versions preserve the age gate for future releases.
  - "@happy-dom/global-registrator@21.0.4"
  - happy-dom@21.0.4
  - body-parser@2.4.0
  - fast-uri@3.1.9
  # First-party ADS icons. `question-circle-filled` first ships in icon-lab
  # 7.8.0 (the only filled question glyph in the design system) and is required
  # by the jira-golden-journey-v4 Team EU variation; icon-lab 7.8.0 in turn
  # needs @atlaskit/icon >= 37.6.0. Taken ahead of the 7-day gate by explicit
  # request, matching the @atlaskit/tokens carve-out above. Version-pinned so
  # the gate re-applies automatically on any future bump; both clear the window
  # on their own (icon 2026-09-05, icon-lab 2026-09-09), so these two lines can
  # simply be deleted after that.
  - "@atlaskit/icon@37.6.0"
  - "@atlaskit/icon-lab@7.8.0"
  # Text Continuity visual component. Place-value number matching (`numbers`,
  # `decimals`) and caret matching (`cursorIndex`) first ship in 0.1.3; 0.1.0 is
  # the newest version clearing the gate and lacks all of them, which is most of
  # what the ported examples demonstrate. Taken ahead of the 7-day gate by
  # explicit request. Version-pinned so the gate re-applies on any future bump;
  # 0.1.3 clears the window on its own (published 2026-09-07), so this can be
  # deleted after 2026-09-14.
  - torph@0.1.3
trustPolicy: no-downgrade
trustPolicyExclude:
  # Existing transitive dependency blocks lockfile refresh under no-downgrade.
  - semver@6.3.1
  # Existing transitive dependency blocks lockfile refresh under no-downgrade.
  - langium@3.3.1
  # Late 3.x backport (published after the attested 4.x line) lacks provenance;
  # pnpm's publish-date trust heuristic flags it as a downgrade. Not a takeover
  # (no advisory; maintained by un-ts). Pinned to the exact locked version so the
  # guard re-applies automatically on any future change.
  - eslint-import-resolver-typescript@3.10.1
  # Transitive of recharts; publish-date trust heuristic flags 5.1.1 as a
  # downgrade (lost provenance a later-published version carries). Reputable
  # (Redux/reselect), no advisory. Version-pinned so the guard re-applies on change.
  - reselect@5.1.1
  # Transitive of @pierre/diffs; 2.0.0 lacks provenance attestations so the
  # publish-date trust heuristic flags it as a downgrade. Verified as the same
  # pierrecomputer/pierre repository and maintainer group, with no advisory.
  # Version-pinned so the guard re-applies on any future change.
  - "@pierre/theme@2.0.0"
  # Transitive of @tobilu/qmd via fast-glob. Verified as the same long-running
  # mcollina/fastq repository and sole maintainer, with no advisory. Version-
  # pinned so the trust guard re-applies on any future release.
  - fastq@1.20.2
# Dependency pinning tiers (see Engineering Standards in AGENTS.md):
#   Float   ^x.y.z  - stable libs; `pnpm update` may take patch + minor
#   Cautious ~x.y.z - libs where minors have broken us; patch only
#   Locked  x.y.z   - framework core + coordinated families; bump manually
# The catalog below holds Locked coordinated families that MUST move together.
# Reference them from package.json as "catalog:". Bump the version here once
# and every member updates in lockstep.
catalog:
  # tiptap - all @tiptap/* must share one version
  '@tiptap/core': 3.32.0
  '@tiptap/extension-code-block': 3.32.0
  '@tiptap/extension-color': 3.32.0
  '@tiptap/extension-highlight': 3.32.0
  '@tiptap/extension-link': 3.32.0
  '@tiptap/extension-list': 3.32.0
  '@tiptap/extension-mention': 3.32.0
  '@tiptap/extension-table': 3.32.0
  '@tiptap/extension-text-align': 3.32.0
  '@tiptap/extension-text-style': 3.32.0
  '@tiptap/extension-underline': 3.32.0
  '@tiptap/markdown': 3.32.0
  '@tiptap/pm': 3.32.0
  '@tiptap/react': 3.32.0
  '@tiptap/starter-kit': 3.32.0
  '@tiptap/suggestion': 3.32.0
  # json-render - published from one monorepo at a single version
  '@json-render/codegen': 0.20.0
  '@json-render/core': 0.20.0
  '@json-render/image': 0.20.0
  '@json-render/ink': 0.20.0
  '@json-render/react': 0.20.0
  '@json-render/react-pdf': 0.20.0
  '@json-render/react-three-fiber': 0.20.0
  '@json-render/remotion': 0.20.0
  '@json-render/yaml': 0.20.0
  # remotion - remotion + every @remotion/* must match exactly
  'remotion': 4.0.536
  '@remotion/player': 4.0.536
overrides:
  '@hono/node-server': ^1.19.15
  '@pierre/trees>@pierre/theming': 1.0.1
  '@react-grab/cli>smol-toml': ^1.9.1
  '@tobilu/qmd>@modelcontextprotocol/server': 2.3.1
  '@xmldom/xmldom': ^0.9.12
  'brace-expansion@^1.0.0': 1.1.21
  'brace-expansion@^5.0.0': 5.0.12
  body-parser: ^2.4.0
  browserslist: ^4.28.7
  dompurify: ^3.4.17
  express-rate-limit: ^8.2.2
  fast-uri: 3.1.9
  'fflate@^0.6.0': 0.6.11
  'fflate@^0.7.0': 0.7.5
  hono: ^4.13.13
  immutable: ^4.3.9
  ip-address: ^10.7.4
  js-yaml: ^4.3.1
  'katex@^0.16.0': 0.18.4
  linkify-it: 5.0.2
  lodash-es: ^4.18.1
  mermaid: ^11.16.1
  'nanoid@^3.0.0': 3.3.18
  'nanoid@^4.0.0': 5.1.16
  'node-llama-cpp>simple-git': 4.0.2
  postcss: ^8.5.30
  prosemirror-model: ^1.25.12
  prosemirror-view: ^1.42.6
  protobufjs: ^7.6.5
  qs: 6.16.1
  sanitize-html: ^2.18.1
  source-map-js: ^1.2.2
  tar: 7.5.21
  undici@^7.0.0: 7.30.1
  undici@^8.0.0: 8.12.2
  ws: ^8.22.0
